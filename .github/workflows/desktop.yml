name: desktop

# Builds the CopySync desktop client (Tauri v2) into native installers.
# Windows is the primary target here (MSI + NSIS .exe via MSVC + WebView2);
# a Linux job builds .deb/AppImage for parity. Triggered on version tags or
# manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf build-essential file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop

      - name: Headless core checks
        run: cargo test -p copysync-core

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # WebView2 runtime ships with Windows 10/11 and the GitHub runners, so no
      # extra install is needed. The frontend is a static dir (no Node step).
      - name: Build installers
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: copysync-${{ matrix.name }}
          path: |
            clients/desktop/target/release/bundle/nsis/*.exe
            clients/desktop/target/release/bundle/msi/*.msi
            clients/desktop/target/release/bundle/deb/*.deb
            clients/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
