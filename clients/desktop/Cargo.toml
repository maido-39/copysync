[workspace]
resolver = "2"
members = ["core", "src-tauri", "ipc", "agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Smaller, faster debug builds for the heavy native deps.
[profile.dev]
opt-level = 1
