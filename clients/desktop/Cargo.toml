[workspace]
resolver = "2"
members = ["core", "src-tauri", "ipc", "agent", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Smaller, faster debug builds for the heavy native deps.
[profile.dev]
opt-level = 1

# Vendored egui-wgpu 0.29.1 with a one-block patch: when no HARDWARE wgpu adapter
# exists (GPU-less / RDP machines), retry requesting the SOFTWARE FALLBACK adapter
# (WARP on Windows / llvmpipe) instead of failing — so the native GUI runs without
# a GPU. eframe 0.29 otherwise hardcodes force_fallback_adapter:false. See
# vendor/egui-wgpu/src/lib.rs (the only change from upstream 0.29.1).
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
