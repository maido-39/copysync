<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>CopySync</title>
    <style>
      :root { --bg:#1b2230; --line:#2a3344; --text:#e6e9f0; --muted:#9aa3b2; --accent:#6366f1; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        display: flex; gap: 12px; align-items: center; padding: 12px 14px;
        background: var(--bg); border-left: 5px solid var(--accent);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
        cursor: default;
      }
      .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); display: none; }
      .col { flex: 1; min-width: 0; }
      .ttl { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .from { color: var(--accent); }
      .body { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
  </head>
  <body>
    <img id="thumb" class="thumb" alt="" />
    <div class="col">
      <div class="ttl">📋 <span class="from" id="from"></span></div>
      <div class="body" id="body"></div>
    </div>
    <script src="toast.js"></script>
  </body>
</html>
