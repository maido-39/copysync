[package]
name = "copysync-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native eframe/egui CopySync desktop GUI — a pure IPC client to copysync-agent."

[[bin]]
name = "copysync-gui"
path = "src/main.rs"

[dependencies]
copysync-ipc = { path = "../ipc" }
# glow (OpenGL) is the primary backend; wgpu (DX12/Vulkan, + WARP software on
# Windows) is a fallback for machines without an OpenGL 2.0+ context (RDP /
# driverless VMs) — main() tries glow then falls back to wgpu. `persistence`
# gives us eframe storage for the saved theme preference.
eframe = { version = "0.29", default-features = false, features = ["glow", "wgpu", "persistence", "default_fonts"] }
egui = "0.29"
interprocess = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = "5"
rfd = "0.15"
# Background-image wallpaper feature (parity with the web/Android clients): decode
# the picked PNG/JPEG, apply brightness + a one-off gaussian blur, then upload the
# result as an egui texture. Pure-Rust codecs only (no system libs) so it cross-
# compiles cleanly to x86_64-pc-windows-gnu.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# M4: tray + global hotkey + login-autostart. Versions pinned to what the
# workspace already resolves (the Tauri side pulls the same crates via its
# plugins), so they coexist cleanly with eframe 0.29's winit 0.30 build graph:
#   * tray-icon 0.23 / muda 0.19  (task suggested 0.19; 0.23 is what resolves)
#   * global-hotkey 0.8           (task suggested 0.6; 0.8 is what resolves)
#   * auto-launch 0.5
tray-icon = "0.23"
global-hotkey = "0.8"
auto-launch = "0.5"
