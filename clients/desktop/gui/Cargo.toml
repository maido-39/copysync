[package]
name = "copysync-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native eframe/egui CopySync desktop GUI — a pure IPC client to copysync-agent."

[[bin]]
name = "copysync-gui"
path = "src/main.rs"

[dependencies]
copysync-ipc = { path = "../ipc" }
# egui's default glow (OpenGL) backend — explicitly NO wgpu, smaller link surface
# and works on the conda GL/X stack. `persistence` gives us eframe storage for the
# saved theme preference.
eframe = { version = "0.29", default-features = false, features = ["glow", "persistence", "default_fonts"] }
egui = "0.29"
interprocess = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = "5"
rfd = "0.15"

# M4: tray + global hotkey + login-autostart. Versions pinned to what the
# workspace already resolves (the Tauri side pulls the same crates via its
# plugins), so they coexist cleanly with eframe 0.29's winit 0.30 build graph:
#   * tray-icon 0.23 / muda 0.19  (task suggested 0.19; 0.23 is what resolves)
#   * global-hotkey 0.8           (task suggested 0.6; 0.8 is what resolves)
#   * auto-launch 0.5
tray-icon = "0.23"
global-hotkey = "0.8"
auto-launch = "0.5"
